<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="Đêm Hội Trăng Rằm - 5 Mini Games vui nhộn cho Tết Trung Thu. Hứng bánh, đập chuột, bay lên trăng và nhiều hơn nữa!">
  <title>🏮 Đêm Hội Trăng Rằm - Game Trung Thu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles/reset.css">
  <link rel="stylesheet" href="./src/styles/variables.css">
  <link rel="stylesheet" href="./src/styles/base.css">
  <link rel="stylesheet" href="./src/styles/animations.css">
  <link rel="stylesheet" href="./src/styles/components.css">
  <link rel="stylesheet" href="./src/styles/hub.css">
</head>
<body class="no-select">
  <div class="hub">
    <canvas id="hub-bg" class="hub-bg"></canvas>
    
    <div class="hub-content">
      <header class="hub-header">
        <div class="hub-lanterns">🏮🏮🏮</div>
        <h1 class="hub-title">Đêm Hội Trăng Rằm</h1>
        <p class="hub-subtitle">Chọn trò chơi bạn yêu thích!</p>
      </header>

      <div class="roulette-section">
        <div class="roulette-container" id="game-roulette">
          <div class="roulette-pointer"></div>
          <div class="roulette-strip" id="roulette-strip"></div>
        </div>
        
        <div class="roulette-container" id="challenge-roulette" style="display: none; margin-top: -10px;">
          <div class="roulette-pointer" style="background: #FFD700; box-shadow: 0 0 15px #FFD700;"></div>
          <div class="roulette-strip" id="challenge-strip"></div>
        </div>
        
        <button id="spin-btn" class="spin-btn">BẮT ĐẦU QUAY</button>
      </div>

      <footer class="hub-footer">
        <p>🌙 Chúc Tết Trung Thu vui vẻ! 🌙</p>
      </footer>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
